# === FRONTEND SONAR CONFIG ===
sonar.projectKey=notes-frontend
sonar.projectName=notes-frontend
sonar.projectVersion=1.0

# === SOURCES ===
sonar.sources=src
# Exclude only what you truly don’t want analyzed
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**
sonar.sourceEncoding=UTF-8

# === TESTS & COVERAGE ===
# Let Sonar know where your tests are and include them
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# === SONAR SERVER ===
sonar.host.url=http://localhost:9000
sonar.token=${env:SONAR_TOKEN}
